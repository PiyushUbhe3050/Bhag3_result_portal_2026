{% load static %}
<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>‘स्व‘-रूपवर्धिनी - परीक्षा निकाल शोध कक्ष</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #dc2626;
            --brand-dark: #991b1b;
        }
        body {
            font-family: 'Noto Sans Devanagari', sans-serif;
            background-color: #fdfbf7;
        }
        .btn-brand {
            background-color: var(--brand-primary);
            color: #ffffff;
            border: none;
            transition: all 0.2s ease-in-out;
        }
        .btn-brand:hover {
            background-color: var(--brand-dark);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        .org-header-banner {
            max-height: 120px;
            width: auto;
            object-fit: contain;
        }
        .campaign-title-badge {
            font-size: 1.25rem !important;
            font-weight: 700;
            padding: 10px 24px !important;
            display: inline-block;
            line-height: 1.5;
        }
        .exam-sub-title {
            font-size: 1.25rem !important;
            font-weight: 700;
            color: #1f2937;
            margin-top: 8px;
        }
    </style>
</head>
<body class="py-4">
<div class="container" style="max-width: 820px;">

    <!-- अधिकृत संस्था बॅनर आणि मोहीम शीर्षके -->
    <div class="text-center mb-4">
        <div class="mb-3">
            <img src="{% static 'results/swaroop_header.png' %}" alt="‘स्व‘-रूपवर्धिनी" class="img-fluid org-header-banner">
        </div>

        <div>
            <span class="badge bg-warning text-dark campaign-title-badge rounded-pill shadow-sm">
                भाग - ३ - वार्षिक/ सहामाही परीक्षा गुणवत्ता वाढ अभियान
            </span>
        </div>

        <div class="exam-sub-title">
            सहामाही परीक्षा - आत्मपरीक्षण व उद्दिष्ट निश्चिती
        </div>
    </div>

    <!-- सर्च फॉर्म -->
    <div class="card shadow border-0 p-4 p-md-5 mb-4 rounded-4 bg-white border-top border-5 border-warning">
        <h4 class="fw-bold text-center text-dark mb-4">परीक्षेचा निकाल शोधा</h4>
        <form method="POST">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label fw-bold fs-5">शाखा नाव <span class="text-danger">*</span></label>
                    <select name="branch_group" class="form-select form-select-lg" required>
                        <option value="" disabled selected>-- तुमची शाखा निवडा --</option>
                        {% for b in branches %}
                        <option value="{{ b.id }}">{{ b.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold fs-5">Roll number <span class="text-danger">*</span></label>
                    <input type="text" name="roll_number" class="form-control form-control-lg" placeholder="उदा. 101" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold fs-5">वर्धक नाव <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control form-control-lg" placeholder="उदा. राहुल शर्मा" required>
                </div>
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-brand w-100 py-3 fs-5 fw-bold shadow rounded-3">
                        गुणपत्रिका पहा (Fetch Report Card) ➔
                    </button>
                </div>
            </div>
        </form>
    </div>

    {% if error %}
    <div class="alert alert-danger shadow-sm rounded-3 text-center fw-semibold fs-5">
        {{ error }}
    </div>
    {% endif %}

    <div class="text-center text-muted small mt-4">
        © ‘स्व‘-रूपवर्धिनी | गुणवत्ता वाढ अभियान शैक्षणिक विभाग
    </div>

</div>
</body>
</html>
