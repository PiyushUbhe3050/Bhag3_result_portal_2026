{% extends "admin/base.html" %}
{% load static %}

{% block title %}‘स्व‘-रूपवर्धिनी | नियंत्रण कक्ष{% endblock %}

{% block extrahead %}
{{ block.super }}
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --brand-red: #c2410c;
        --brand-dark: #7c2d12;
        --brand-gold: #f59e0b;
        --brand-bg: #f8fafc;
        --card-border: #e2e8f0;
    }

    body {
        font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif !important;
        background-color: var(--brand-bg) !important;
        color: #1e293b !important;
        margin: 0 !important;
        -webkit-tap-highlight-color: transparent;
    }

    /* Branded Header */
    #header {
        background: linear-gradient(135deg, #7c2d12 0%, #c2410c 100%) !important;
        padding: 12px 16px !important;
        border-bottom: 3px solid var(--brand-gold) !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .branding-container {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .branding-logo {
        max-height: 44px;
        background: #ffffff;
        padding: 3px 6px;
        border-radius: 6px;
    }

    .branding-title {
        font-size: 1.15rem;
        font-weight: 800;
        color: #ffffff;
        line-height: 1.2;
    }

    .branding-sub {
        font-size: 0.75rem;
        color: #fef08a;
    }

    #user-tools {
        font-size: 0.82rem !important;
        color: #ffffff !important;
        font-weight: 600 !important;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }

    #user-tools a {
        color: #fef08a !important;
        padding: 4px 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.12);
        text-decoration: none;
    }

    /* Co-Admin Mobile View Wrapper */
    .mobile-shell {
        max-width: 480px;
        margin: 0 auto;
        padding: 12px;
    }

    /* Super-Admin Desktop Shell */
    .desktop-shell {
        max-width: 1240px;
        margin: 0 auto;
        padding: 20px;
    }

    /* Buttons & Standard Admin Elements */
    .button, input[type=submit], .submit-row input {
        background: var(--brand-red) !important;
        border: none !important;
        color: #fff !important;
        border-radius: 8px !important;
        font-weight: 700 !important;
        padding: 10px 18px !important;
        font-size: 0.95rem !important;
    }

    .button:hover, input[type=submit]:hover {
        background: var(--brand-dark) !important;
    }

    .breadcrumbs {
        background: #ffffff !important;
        border: 1px solid var(--card-border) !important;
        border-radius: 8px !important;
        margin: 10px auto !important;
        padding: 8px 14px !important;
        font-size: 0.85rem !important;
    }
</style>
{% endblock %}

{% block branding %}
<div class="branding-container">
    <a href="{% url 'admin:index' %}">
        <img src="{% static 'results/swaroop_header.png' %}" alt="‘स्व‘-रूपवर्धिनी" class="branding-logo">
    </a>
    <div>
        <div class="branding-title">‘स्व‘-रूपवर्धिनी - नियंत्रण कक्ष</div>
        <div class="branding-sub">भाग - ३ - गुणवत्ता वाढ अभियान</div>
    </div>
</div>
{% endblock %}
