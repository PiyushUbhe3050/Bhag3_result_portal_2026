{% extends "admin/base.html" %}
{% load static %}

{% block title %}‘स्व‘-रूपवर्धिनी नियंत्रण कक्ष{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    /* १. विस्कळीत डार्क मोड टॉगल आयकॉन्स पूर्णपणे लपवा */
    .theme-toggle, 
    #theme-toggle,
    button.theme-toggle,
    .toggle-nav-sidebar {
        display: none !important;
    }

    body {
        font-family: 'Noto Sans Devanagari', -apple-system, sans-serif !important;
    }

    /* २. ब्रँडेड हेडर बार */
    #header {
        background: linear-gradient(135deg, #7c2d12 0%, #c2410c 100%) !important;
        color: #ffffff !important;
        padding: 12px 20px !important;
    }

    #branding h1 {
        margin: 0 !important;
        font-size: 1.15rem !important;
        font-weight: 800 !important;
        color: #ffffff !important;
    }

    #branding h1 a:link, #branding h1 a:visited {
        color: #ffffff !important;
        text-decoration: none !important;
    }

    #user-tools {
        font-size: 0.85rem !important;
        color: #fef08a !important;
    }

    #user-tools a {
        color: #ffffff !important;
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">
        🚩 ‘स्व‘-रूपवर्धिनी — नियंत्रण कक्ष (Admin Desk)
    </a>
</h1>
{% endblock %}
